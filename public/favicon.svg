<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Símbolo Oficial do Instituto Federal com Fundo Transparente -->
  <!-- Coluna 1: 'i' (Círculo Vermelho no topo + 3 blocos verdes) -->
  <circle cx="9" cy="7" r="2.4" fill="#E52320" />
  <rect x="6.6" y="10.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="6.6" y="16.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="6.6" y="22.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />

  <!-- Coluna 2: Haste do 'F' (4 blocos verdes) -->
  <rect x="13.6" y="4.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="13.6" y="10.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="13.6" y="16.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="13.6" y="22.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />

  <!-- Coluna 3: Braços do 'F' (2 blocos verdes superiores) -->
  <rect x="20.6" y="4.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="20.6" y="10.6" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
</svg>
