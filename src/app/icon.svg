<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ifBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  
  <!-- Fundo Dark com bordas suaves para contraste perfeito em qualquer aba -->
  <rect width="32" height="32" rx="7" fill="url(#ifBg)" stroke="#27272a" stroke-width="1"/>
  
  <!-- Símbolo Oficial do Instituto Federal (Grid 3x4 padronizado) -->
  <!-- Coluna 1: 'i' (Círculo Vermelho no topo + 3 quadrados verdes) -->
  <circle cx="9" cy="8.5" r="2.4" fill="#E52320" />
  <rect x="6.6" y="12.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="6.6" y="18.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="6.6" y="24.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />

  <!-- Coluna 2: Haste do 'F' (4 quadrados verdes) -->
  <rect x="13.6" y="6.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="13.6" y="12.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="13.6" y="18.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="13.6" y="24.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />

  <!-- Coluna 3: Braços do 'F' (2 quadrados verdes superiores) -->
  <rect x="20.6" y="6.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
  <rect x="20.6" y="12.2" width="4.8" height="4.8" rx="1.2" fill="#2F9E41" />
</svg>
